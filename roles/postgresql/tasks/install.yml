
---
- name: Instalar PostgreSQL y librerías necesarias
  become: true
  ansible.builtin.zypper:
    name:
      - postgresql-server
      - php8-pgsql
      - python3-psycopg2
    state: present

- name: Habilitar e iniciar PostgreSQL
  become: true
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
