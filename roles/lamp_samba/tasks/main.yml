---
- name: Instalar Apache y PHP
  ansible.builtin.import_tasks: apache_php.yml

- name: Instalar MariaDB
  ansible.builtin.import_tasks: mariadb.yml

- name: Instalar phpMyAdmin
  ansible.builtin.import_tasks: phpmyadmin.yml

# samba_share.yml instala el paquete samba, por eso debe ir ANTES de samba_users.yml
# (smbpasswd no existe hasta que Samba esta instalado).
- name: Configurar recurso compartido Samba
  ansible.builtin.import_tasks: samba_share.yml

- name: Crear usuarios Samba
  ansible.builtin.import_tasks: samba_users.yml
